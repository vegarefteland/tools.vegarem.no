<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 192">
  <!-- Studio favicon: the folder. White on a dark browser chrome, black on a
       light one. Both are the supplied 192px PNGs, embedded so this one file
       works on its own. -->
  <style>
    .on-dark { display: inline; } .on-light { display: none; }
    @media (prefers-color-scheme: light) { .on-dark { display: none; } .on-light { display: inline; } }
  </style>
  <image class="on-dark"  width="192" height="192" href="data:image/png;base64,"/>
  <image class="on-light" width="192" height="192" href="data:image/png;base64,"/>
</svg>
