<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Path View – Tools</title>
<link rel="icon" href="/tools/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/tools/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/tools/favicon-180.png">
<link rel="stylesheet" href="../shared.css">
<style>
  body { padding: 72px 16px 16px; height: 100vh; overflow: hidden; }
  .app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 14px; height: 100%; }
  .panel {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; min-height: 0;
  }
  .panel-inner { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .h { font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .sep-line { height: 1px; background: var(--border); }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .hidden { display: none !important; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border);
    border-radius: 100px; padding: 3px; gap: 2px; }
  .seg.wrap { display: flex; flex-wrap: wrap; border-radius: 12px; }
  .seg button { padding: 6px 8px; font: 500 11.5px var(--font); border: 0; border-radius: 100px;
    background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg.wrap button { flex: 1 0 auto; }
  .seg button.active { background: var(--tag-bg); color: var(--tag-fg); }
  .seg button:hover:not(.active) { color: var(--fg); }

  details.sec { border-top: 1px solid var(--border); padding-top: 10px; }
  details.sec > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted);
    user-select: none; padding: 2px 0;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: "+"; font-size: 13px; font-weight: 400; transition: transform 200ms var(--ease-out); }
  details.sec[open] > summary::after { transform: rotate(45deg); }
  details.sec > summary:hover { color: var(--fg); }
  .sec-body { display: flex; flex-direction: column; gap: 10px; padding: 10px 0 4px; }

  .ctl { display: flex; flex-direction: column; gap: 5px; }
  .ctl-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; }
  .ctl-head .name { opacity: .75; cursor: pointer; }
  .ctl-head .name:hover { opacity: 1; }
  .ctl-head .val { font: 500 11px ui-monospace, Menlo, monospace; color: var(--muted); }
  input[type="range"] { width: 100%; height: 16px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--border); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: var(--fg); border: 0; }
  input[type="range"]::-moz-range-track { height: 3px; background: var(--border); border-radius: 2px; }
  input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: 0; }
  select, input[type="text"], input[type="number"], textarea {
    padding: 6px 9px; font: 12px var(--font); border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--fg); outline: none; width: 100%;
  }
  textarea { resize: vertical; min-height: 54px; font-family: var(--mono); font-size: 11px; }
  #text { font-size: 15px; }
  select:focus, input:focus, textarea:focus { border-color: var(--muted); }

  .chk { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; cursor: pointer; }
  .chk > span:first-child { opacity: .75; }
  .switch { position: relative; width: 28px; height: 16px; flex-shrink: 0; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; }
  .switch b { position: absolute; inset: 0; border-radius: 100px; background: var(--border); transition: background 150ms; pointer-events: none; }
  .switch b::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); transition: transform 180ms var(--ease-out); }
  .switch input:checked + b { background: var(--fg); }
  .switch input:checked + b::after { transform: translateX(12px); }

  .colrow { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; }
  .colrow > span:first-child { opacity: .75; }
  .colrow label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .colrow code { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
  input[type="color"] { width: 24px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }

  .file-chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); font-size: 12px; }
  .file-chip .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .k { font: 10px ui-monospace, Menlo, monospace; color: var(--muted); white-space: nowrap; }
  .drop-hint { font-size: 11px; color: var(--muted); line-height: 1.5; }

  /* ─── Stage ─────────────────────────────────────────────── */
  .stage-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
  .stage { position: relative; flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: var(--radius); touch-action: none;
    overflow: hidden; cursor: grab; }
  .stage.dragging { cursor: grabbing; }
  .stage.drop::after { content: "Drop a font or an SVG"; position: absolute; inset: 10px; border: 2px dashed var(--fg);
    border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px;
    background: rgba(0,0,0,.4); color: #fff; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tip { position: absolute; pointer-events: none; font: 10.5px var(--mono);
    padding: 4px 7px; border-radius: 5px; background: rgba(0,0,0,.78); color: #fff; white-space: nowrap; display: none; }
  .stage-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--nav-bg);
    color: var(--fg); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .icon-btn:hover { box-shadow: var(--hover-shadow); }
  .icon-btn svg { width: 14px; height: 14px; }

  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 14px; background: var(--surface); }
  .stat { display: flex; flex-direction: column; gap: 1px; }
  .stat span { font-size: 9.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
  .stat b { font: 600 13px ui-monospace, Menlo, monospace; }
  .stat b.bad { color: var(--danger); }

  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .theme { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); cursor: pointer; font-size: 11.5px; color: var(--fg); }
  .theme:hover { border-color: var(--muted); }
  .theme.active { border-color: var(--fg); }
  .theme .x { margin-left: auto; color: var(--muted); padding: 0 2px; border-radius: 4px; }
  .theme .x:hover { color: var(--danger); }
  .theme i { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(128,128,128,.4); }

  .pill-btn { justify-content: center; font-size: 12px; width: 100%; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .note { font-size: 11px; color: var(--muted); line-height: 1.45; }
  .note.err { color: var(--danger); }
  kbd { font: 10px ui-monospace, Menlo, monospace; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--fg); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(70px);
    background: var(--tag-bg); color: var(--tag-fg); padding: 9px 18px; border-radius: 100px; font-size: 12px;
    font-weight: 500; opacity: 0; transition: transform 400ms var(--ease-out), opacity 400ms; pointer-events: none; z-index: 600; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 1150px) {
    body { height: auto; overflow: auto; }
    .app { grid-template-columns: 1fr; height: auto; }
    .stage-col { order: -1; }
    .stage { height: 62vh; flex: none; }
    .panel { overflow: visible; }
  }
</style>
<link rel="stylesheet" href="/tools/skin.css"><!-- last: the shared look wins -->
</head>
<body>

<div class="hub-nav">
  <div class="hub-pill" id="nav"></div>
  <button class="theme-toggle-btn" id="themeToggle" title="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon"></svg>
  </button>
</div>

<div class="app">
  <!-- ─── Left: source and layout ───────────────────────────── -->
  <aside class="panel">
    <div class="panel-inner" id="left">
      <div class="seg" id="srcSeg">
        <button data-src="type">Type</button>
        <button data-src="svg">Vector</button>
      </div>

      <div id="typeBox" style="display:flex;flex-direction:column;gap:10px">
        <div id="fontChip"></div>
        <div class="row">
          <button class="pill-btn" id="fontBtn">Load font file…</button>
          <button class="pill-btn" id="localBtn" title="Pick from fonts installed on this Mac">Installed font…</button>
        </div>
        <select id="localList" class="hidden"></select>
        <div class="ctl">
          <div class="ctl-head"><span class="name">Text</span></div>
          <textarea id="text" spellcheck="false">a</textarea>
        </div>
        <div class="drop-hint">.ttf, .otf and .woff. TrueType shows quadratic curves with a single
          control point; PostScript fonts show cubic curves with two.</div>
      </div>

      <div id="svgBox" style="display:flex;flex-direction:column;gap:10px" class="hidden">
        <div id="svgChip"></div>
        <button class="pill-btn" id="svgBtn">Load SVG…</button>
        <div class="ctl">
          <div class="ctl-head"><span class="name">…or paste path data</span></div>
          <textarea id="pathData" spellcheck="false" placeholder="M10 10 C 40 0 60 0 90 10 …"></textarea>
        </div>
        <button class="pill-btn" id="pasteBtn">Use pasted path</button>
      </div>
      <input type="file" id="fontInput" accept=".ttf,.otf,.woff,font/ttf,font/otf,font/woff" style="display:none">
      <input type="file" id="svgInput" accept=".svg,image/svg+xml" style="display:none">
      <div class="note" id="srcNote"></div>

      <div class="sep-line"></div>
      <div class="h">Setting presets</div>
      <div class="themes" id="settingList"></div>
      <div class="themes" id="userSettings"></div>
      <div class="row">
        <input type="text" id="presetName" placeholder="Name this setting…">
        <button class="pill-btn" id="savePreset" style="flex:0 0 auto;width:auto;padding:0 14px">Save</button>
      </div>
      <button class="pill-btn" id="randomGlyph" title="Pick a random character the font contains (G)">Random glyph</button>
      <!-- generated sections land here -->
    </div>
  </aside>

  <!-- ─── Centre: the view ──────────────────────────────────── -->
  <main class="stage-col">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="tip" id="tip"></div>
      <div class="stage-tools">
        <button class="icon-btn" id="fitBtn" title="Fit to view (0)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="zoomIn" title="Zoom in (+)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="zoomOut" title="Zoom out (−)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <div class="bar" id="stats"></div>
  </main>

  <!-- ─── Right: look and export ────────────────────────────── -->
  <aside class="panel">
    <div class="panel-inner" id="right">
      <div class="h">Look</div>
      <div class="themes" id="themes"></div>
      <!-- generated sections land here -->
      <div class="sep-line"></div>
      <div class="h">Export</div>
      <div class="btn-grid">
        <button class="pill-btn pill-btn-primary" id="pngBtn">PNG</button>
        <button class="pill-btn" id="svgOutBtn">SVG</button>
        <button class="pill-btn" id="copySvg">Copy SVG</button>
        <button class="pill-btn" id="copyD">Copy path</button>
        <button class="pill-btn" id="copyPts">Copy points</button>
        <button class="pill-btn" id="resetBtn">Reset look</button>
      </div>
      <div class="note" id="exportNote"></div>
      <div class="note">
        <kbd>drag</kbd> pan · <kbd>scroll</kbd> zoom · <kbd>0</kbd> fit<br>
        Hover a point to read its coordinates. Double-click a setting's name to reset it.
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script src="../vendor/pako/pako.umd.min.js"></script>
<script src="font.js"></script>
<script src="paths.js"></script>
<script src="app.js"></script>
</body>
</html>
